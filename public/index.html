<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transcript</title>
    <meta
      name="description"
      content="Paste a YouTube link and copy a study-notes prompt as GitHub markdown."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Fraunces:opsz,wght@9..144,500..650&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="mast">
        <p class="mark">Transcript</p>
        <h1>The whole video, in words.</h1>
        <p class="lede">
          Paste a public YouTube link. Copy for AI pulls out the main ideas.
          Copy study notes asks for key concepts, definitions, diagrams, and
          lingering questions as GitHub markdown, so the diagrams render in a repo.
        </p>
      </header>

      <form id="form" class="composer" novalidate>
        <label class="sr" for="url">YouTube URL</label>
        <input
          id="url"
          name="url"
          type="text"
          inputmode="url"
          autocomplete="off"
          spellcheck="false"
          placeholder="https://www.youtube.com/watch?v=…"
        />
        <button id="submit" type="submit">Get transcript</button>
      </form>
      <p id="error" class="error" role="alert" hidden></p>

      <section id="result" class="result" hidden>
        <div class="video">
          <img id="thumb" class="thumb" alt="" />
          <div class="video-copy">
            <h2 id="title"></h2>
            <p id="meta" class="meta"></p>
            <a id="watch" href="" target="_blank" rel="noopener noreferrer">Open on YouTube</a>
            <div id="langs" class="langs" role="group" aria-label="Caption language"></div>
          </div>
        </div>

        <div class="toolbar">
          <p id="stats" class="stats"></p>
          <div class="actions">
            <label class="toggle">
              <input id="timestamps" type="checkbox" />
              Timestamps
            </label>
            <button id="copy-text" class="ghost" type="button">Copy transcript</button>
            <button id="copy" type="button">Copy for AI</button>
            <button id="copy-notes" type="button">Copy study notes</button>
          </div>
        </div>
        <p id="status" class="sr" role="status"></p>
        <article id="transcript" class="transcript" aria-live="polite"></article>
      </section>
    </main>
    <script src="captions.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
